services:
  app:
    build: .
    container_name: flaskr-app
    volumes:
      - flaskr-data:/app/instance
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: flaskr-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  flaskr-data: